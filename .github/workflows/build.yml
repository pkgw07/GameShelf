name: Build

# main 에 올리면: 빌드가 되는지 검사하고 설치 파일을 Actions 결과물로 남김
# 커밋 메시지에 [release] 가 있거나, v* 태그를 올리거나, Actions 화면에서 release 를 켜고 실행하면:
#   package.json 버전으로 설치 파일을 만들어 Releases 에 게시 → 설치된 프로그램이 자동 업데이트
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Releases 에 게시'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Self-test inside Electron
        shell: pwsh
        run: |
          npx electron . --selftest
          $code = $LASTEXITCODE
          Get-Content selftest-result.json
          if ($code -ne 0) { exit $code }

      - name: Package
        if: ${{ env.PUBLISH != 'true' }}
        run: npx electron-builder --win --publish never

      - name: Upload installer
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: GameShelf-Setup
          path: dist/*.exe
          retention-days: 14

      - name: Package for release
        if: ${{ env.PUBLISH == 'true' }}
        run: npx electron-builder --win --publish never

      - name: Publish to GitHub Releases
        if: ${{ env.PUBLISH == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' -and $_.Name -notmatch 'builder-debug' } | ForEach-Object { $_.FullName })
          Write-Host "files: $($files -join ', ')"
          if ($files.Count -lt 3) { Write-Host "::error::설치 파일, blockmap, latest.yml 중 일부가 없습니다: $($files -join ', ')"; exit 1 }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $out = gh release upload $tag @files --clobber 2>&1
          } else {
            $notes = "GameShelf $v`n`n**설치:** 아래 Assets에서 ``GameShelf-Setup-$v.exe``를 받아 실행하세요. 이미 설치했다면 프로그램이 자동으로 업데이트를 알려 줍니다.`n`n변경 내용은 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)를 참고하세요."
            $out = gh release create $tag @files --title "GameShelf $v" --notes $notes --target ${{ github.sha }} 2>&1
          }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $msg = (($out | Select-Object -Last 15) -join '%0A')
            Write-Host "::error title=릴리스 게시 실패::$msg"
            exit $code
          }
